# Resmî Gazete maddelerinin konu kategorileri.
#
# Yeni kategori eklemek için aşağıdaki bloklardan birini kopyalayın.
# Kod (anahtar) yalnız küçük harf, rakam ve tire içerebilir; RSS dosyası
# feeds/<kod>.xml olarak üretilir.
#
# Alanlar:
#   ad                : sitede ve RSS'te görünen ad
#   aciklama          : kısa açıklama
#   renk              : sitedeki etiket rengi
#   vurgulu           : true ise sitede ve Telegram bildiriminde öne çıkar
#   anahtar_kelimeler : başlıkta/kurumda kelime BAŞINDA geçerse eşleşir, ek alabilir
#                       ("ithalat" → "İthalatta", "ithalatına" da eşleşir)
#   tam_kelimeler     : yalnız kelimenin tamamı eşleşir (kısaltmalar: KDV, GES …)
#   haric             : bunlardan biri geçerse bu kategori VERİLMEZ
#   turler / bolumler / kurumlar : fihristteki tür, bölüm ya da kurum adında geçerse
#
# Eşleştirme büyük/küçük harf ve Türkçe karakter duyarsızdır: "gümrük" = "GUMRUK".

kategoriler:
  gumruk:
    ad: Gümrük
    aciklama: Gümrük mevzuatı, tarife, rejimler, yetkilendirilmiş yükümlü, serbest bölge, kaçakçılık
    renk: "#c2410c"
    vurgulu: true
    anahtar_kelimeler:
      - gümrük
      - gtip
      - tarife cetveli
      - yetkilendirilmiş yükümlü
      - onaylanmış kişi
      - antrepo
      - transit
      - serbest bölge
      - kaçakçılık
      - menşe
      - dahilde işleme
      - hariçte işleme
      - geçici ithalat
      - ata karne
      - tır karne
      - eşya kontrol
      - sınır kapı
      - sınır ticaret
    tam_kelimeler: [ncts, eur.1, a.tr, yys]

  dis-ticaret:
    ad: İthalat / İhracat
    aciklama: Dış ticaret, ithalat ve ihracat rejimleri, damping, korunma önlemleri, ihracat destekleri
    renk: "#0e7490"
