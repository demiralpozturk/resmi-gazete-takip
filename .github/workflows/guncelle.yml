name: Resmî Gazete güncelle

on:
  schedule:
    - cron: "15 4 * * *"   # 07:15 TR — günün sayısı (gazete gece yarısı yayımlanır)
    - cron: "30 20 * * *"  # 23:30 TR — gün içinde çıkan mükerrer sayılar
  workflow_dispatch:
    inputs:
      gun:
        description: "Geriye dönük kaç gün taransın (var olan günler atlanır)"
        default: "30"

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resmî Gazete'yi tara
        run: python -m rgtakip guncelle --gun "${{ inputs.gun || '30' }}" --yeni-dosya yeni.json

      - name: Yeni içerik varsa commit at
        id: commit
        run: |
          git add data feeds feed.xml
          if git diff --cached --quiet; then
            echo "Yeni içerik yok; commit atılmadı."
            echo "degisti=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(python -m rgtakip ozet yeni.json)"
          git push
          echo "degisti=true" >> "$GITHUB_OUTPUT"

      - name: Telegram bildirimi (isteğe bağlı)
        if: steps.commit.outputs.degisti == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_KATEGORILER: ${{ vars.TELEGRAM_KATEGORILER }}
        run: python -m rgtakip telegram yeni.json
